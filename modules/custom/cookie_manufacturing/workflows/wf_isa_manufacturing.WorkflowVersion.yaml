workflowExternalId: {{ workflowExternalId }}
version: {{ workflowVersion }}
workflowDefinition:
  description: Run ISA asset build, then overlays in parallel
  tasks:
  - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_isatree'
    type: transformation
    parameters:
      transformation:
        externalId: '{{ userPrefix }}isa_asset_tr'
        concurrencyPolicy: fail
    name: Build ISA Asset Tree
    description: Create ISAAsset nodes and hierarchy from RAW
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
  - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_enterprise'
    type: transformation
    parameters:
      transformation:
        externalId: '{{ userPrefix }}enterprise_tr'
        concurrencyPolicy: fail
    name: Enterprise overlay
    description: Upsert Enterprise view fields
    retries: 3
    timeout: 3600
    onFailure: skipTask
    dependsOn:
    - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_isatree'
  - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_site'
    type: transformation
    parameters:
      transformation:
        externalId: '{{ userPrefix }}site_tr'
        concurrencyPolicy: fail
    name: Site overlay
    description: Upsert Site view fields
    retries: 3
    timeout: 3600
    onFailure: skipTask
    dependsOn:
    - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_isatree'
  - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_area'
    type: transformation
    parameters:
      transformation:
        externalId: '{{ userPrefix }}area_tr'
        concurrencyPolicy: fail
    name: Area overlay
    description: Upsert Area view fields
