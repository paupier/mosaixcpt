    dependsOn:
    - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_isatree'
  - externalId: '{{ userPrefix }}wf_isa_manufacturing_t_unit'
    type: transformation
    parameters:
      transformation:
        externalId: '{{ userPrefix }}unit_tr'
        concurrencyPolicy: fail
    name: Unit overlay
    description: Upsert Unit view fields
    retries: 3
